<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light dark" />
<style>
body{margin:0;display:grid;min-height:100vh;place-items:center;font:15px/1.5 system-ui,sans-serif;background:Canvas;color:CanvasText}
a{color:inherit}
</style>
<title>Page not found</title>
<script>
const base="/";
const [version,api,...page]=location.pathname.startsWith(base)?location.pathname.slice(base.length).split("/"):[];
const line=/^(\d+\.\d+)\./.exec(version||"")?.[1];
if(version&&api==="api"){location.replace("https://micronaut-projects.github.io/micronaut-docs"+"/"+(line?line+(line==="3.10"||line==="4.10"?"x":".x"):version)+"/api/"+page.join("/")+location.search+location.hash);}
</script>
</head>
<body>
<p>This page does not exist. <a href="/">Browse the Micronaut docs</a></p>
</body>
</html>
